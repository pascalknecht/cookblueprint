services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nextjs-boilerplate
    ports:
      # Use POSTGRES_PORT to override the default stable host port.
      - target: 5432
        published: "${POSTGRES_PORT:-5432}"
        protocol: tcp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - ./apps/nextjs/.env
    environment:
      # Host is the "postgres" service name, not localhost, from inside the compose network.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nextjs-boilerplate
      # Bind-mounted source needs polling for reliable file-watching (esp. on Windows/Docker Desktop).
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      # Use NEXTJS_PORT to override the default stable host port.
      - target: 3000
        published: "${NEXTJS_PORT:-3000}"
        protocol: tcp
    volumes:
      - .:/app
      - nextjs_node_modules:/app/node_modules
      - nextjs_app_node_modules:/app/apps/nextjs/node_modules
      - nextjs_next_cache:/app/apps/nextjs/.next
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      # Use PGADMIN_PORT to override the default stable host port.
      - target: 80
        published: "${PGADMIN_PORT:-5050}"
        protocol: tcp
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
  nextjs_node_modules:
  nextjs_app_node_modules:
  nextjs_next_cache:
