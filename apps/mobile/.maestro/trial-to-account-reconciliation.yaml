appId: com.mise.app
tags:
  - server
---
# Requires the Next.js backend running and reachable, and the seeded account
# from `pnpm seed:e2e-user` (apps/nextjs) — see .maestro/README notes.
#
# Exercises reconcileTrialData() (src/lib/reconcile-trial-data.ts): local
# trial-mode data gets pushed to the account on login. There's currently no
# in-app link from trial mode to the Login screen (the Household trial banner
# only offers "Create account"), so this deep-links straight to /login —
# the same screen, just reached a different way than a real user could today.
#
# Reuses the seeded e2e account, so "Reconciled Trial Recipe" accumulates one
# more copy of itself in that account's household on every run — harmless for
# the assertion below, but worth knowing if you're inspecting that account's
# data directly.
- launchApp:
    clearState: true
- tapOn:
    id: "welcome-try-it-out"
- assertVisible:
    id: "recipes-screen"

- tapOn:
    id: "recipes-add-button"
- tapOn:
    id: "add-recipe-manual-option"
- tapOn:
    id: "manual-title-input"
- inputText: "Reconciled Trial Recipe"
- tapOn:
    id: "manual-ingredients-input"
- inputText: "Flour"
- tapOn:
    id: "manual-save-button"
- assertVisible:
    id: "recipes-screen"
- assertVisible: "Reconciled Trial Recipe"

- openLink: "mise://login"
- tapOn:
    id: "login-email-input"
- inputText: "e2e@example.com"
- tapOn:
    id: "login-password-input"
- inputText: "e2e-test-password-1234"
- tapOn:
    id: "login-submit-button"
- assertVisible:
    id: "recipes-screen"
- assertVisible: "Reconciled Trial Recipe"
