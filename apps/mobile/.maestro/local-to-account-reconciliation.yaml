appId: com.mise.app
tags:
  - server
---
# Requires the Next.js backend running and reachable, and the seeded account
# from `pnpm seed:e2e-user` (apps/nextjs) — see .maestro/README notes.
#
# Exercises reconcileLocalData() (src/lib/reconcile-local-data.ts): on-device
# local-mode data gets pushed to the account on login. Settings' local-mode
# banner also links to Login; this deep-links straight to /login so the flow
# doesn't depend on navigating Settings first.
#
# Reuses the seeded e2e account, so "Reconciled Local Recipe" accumulates one
# more copy of itself in that account's household on every run — harmless for
# the assertion below, but worth knowing if you're inspecting that account's
# data directly.
- launchApp:
    clearState: true
- tapOn:
    id: "welcome-try-it-out"
- assertVisible:
    id: "recipes-screen"

- tapOn:
    id: "recipes-add-button"
- tapOn:
    id: "add-recipe-manual-option"
- tapOn:
    id: "manual-title-input"
- inputText: "Reconciled Local Recipe"
- tapOn:
    id: "manual-ingredients-input"
- inputText: "Flour"
- tapOn:
    id: "manual-save-button"
- assertVisible:
    id: "recipes-screen"
- assertVisible: "Reconciled Local Recipe"

- openLink: "mise://login"
- tapOn:
    id: "login-email-input"
- inputText: "e2e@example.com"
- tapOn:
    id: "login-password-input"
- inputText: "e2e-test-password-1234"
- tapOn:
    id: "login-submit-button"
- assertVisible:
    id: "recipes-screen"
- assertVisible: "Reconciled Local Recipe"
