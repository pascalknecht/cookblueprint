appId: com.mise.app
tags:
  - offline
---
- launchApp:
    clearState: true
- tapOn:
    id: "welcome-try-it-out"
- assertVisible:
    id: "recipes-screen"

# A recipe has to exist before it can be assigned to a meal slot.
- tapOn:
    id: "recipes-add-button"
- tapOn:
    id: "add-recipe-manual-option"
- tapOn:
    id: "manual-title-input"
- inputText: "E2E Test Recipe"
- tapOn:
    id: "manual-ingredients-input"
- inputText: "Flour"
- tapOn:
    id: "manual-save-button"
- assertVisible:
    id: "recipes-screen"

- tapOn:
    id: "tab-plan"
- assertVisible:
    id: "plan-screen"
# Monday's breakfast slot, empty by default on a fresh trial account.
- tapOn:
    id: "meal-cell-empty-0-breakfast"
- tapOn: "E2E Test Recipe"
- assertVisible: "E2E Test Recipe"
